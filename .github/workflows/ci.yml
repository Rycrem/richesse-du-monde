name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          push: false
          load: true
          tags: stonks-valley:ci
      - name: Le conteneur se met à jour depuis git puis sert le jeu
        run: |
          docker run -d -p 3000:3000 --name sv stonks-valley:ci
          for i in $(seq 1 240); do
            if curl -sf http://localhost:3000/ | grep -q "Stonks Valley"; then
              docker logs sv 2>&1 | grep "\[maj\]"
              docker logs sv 2>&1 | grep -q "\[maj\] version .* installée" && exit 0
            fi
            sleep 1
          done
          docker logs sv
          exit 1
